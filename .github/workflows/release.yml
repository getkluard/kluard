name: Release

# Push a tag such as v0.1.0 to build binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MOD="$(sed -n 's/^module //p' go.mod)"
          mkdir dist
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X $MOD/internal/agent.Version=$VERSION" -o dist/kluard-agent-$os-$arch$ext ./cmd/kluard-agent
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X $MOD/internal/buildinfo.Version=$VERSION" -o dist/kluard-linux-$arch ./cmd/kluard
          done
          # server bundles: the server, the agents it hands out to new machines (dist/) and the checksums, in one archive
          for arch in amd64 arm64; do
            b=kluard-server-linux-$arch
            mkdir -p bundle/$b/dist
            cp dist/kluard-linux-$arch bundle/$b/kluard
            cp dist/kluard-agent-* bundle/$b/dist/
            (cd bundle/$b/dist && sha256sum kluard-agent-* > SHA256SUMS)
            cp README.md LICENSE bundle/$b/
            tar -C bundle -czf dist/$b.tar.gz $b
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Which file do I download?

            - **Server and agents together: `kluard-server-linux-amd64.tar.gz`** (or `-arm64`). It holds the server and the Linux and Windows agents that *Add a machine* hands out to new machines. Unpack it and start `kluard` with `KLUARD_DIST_DIR` pointing at its `dist/` folder (see the README, "Server from a release file").
            - **With Docker:** use the source and `./install.sh`; it builds the server and the agents for you.
            - **Only an agent, on one machine:** `kluard-agent-linux-*` or `kluard-agent-windows-*`. Normally you use the install command under *Add a machine* instead.
            - `kluard-linux-*` is the server alone, without agents. Check any file against `SHA256SUMS`.
          prerelease: true
